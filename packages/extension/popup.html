<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width, initial-scale=1"><title>公众号图片助手</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header class="header"><span class="brand" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m7 16 4-5 3 3 3-4M8 8h.01"/></svg></span><div><h1>公众号图片助手</h1><p>让图文，一起过去</p></div><span id="overall" class="badge">未连接</span></header>
<main>
<section class="status-card" aria-label="Obsidian 连接"><div class="card-heading"><span class="app-icon obsidian-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 7 5-2 11-7 2-5-8Z"/><path d="m12 3-2 10 7 6M5 13h5"/></svg></span><div class="card-title"><h2>Obsidian</h2><p id="vault-name">本机笔记库</p></div><span id="obsidian-status" class="status-label">未连接</span></div></section>
<section class="status-card" aria-label="微信公众号"><div class="card-heading"><span class="app-icon wechat-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11c0 4-4 7-8 7H8l-4 3 1-5a7 7 0 0 1-2-5c0-4 4-7 9-7s8 3 8 7Z"/><path d="M8 10h.01M15 10h.01"/></svg></span><div class="card-title"><h2>微信公众号</h2><p id="account-name">自动跟随已登录后台</p></div><span id="wechat-badge" class="status-label">待检查</span></div><p id="wechat-status" class="card-note">连接后自动识别，无需选择账号</p></section>
<div id="vault-choices" class="vault-choices" hidden></div>
<p id="status" class="feedback" role="status" aria-live="polite">首次连接只需在 Obsidian 允许一次</p>
<button id="primary" class="primary" type="button">连接 Obsidian <span aria-hidden="true">→</span></button>
<details id="settings" class="settings"><summary>诊断与设置<svg aria-hidden="true" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4"/></svg></summary><div class="settings-content"><dl><div><dt>最近连接</dt><dd id="connected-at">—</dd></div><div><dt>最近中断</dt><dd id="disconnect-reason">—</dd></div><div><dt>助手版本</dt><dd id="version">—</dd></div></dl><div class="secondary-actions"><button id="retry" type="button">重新检查</button><button id="pause" type="button">暂停自动连接</button><button id="diagnostics" type="button">复制诊断</button><button id="disconnect" class="quiet-danger" type="button">移除连接记录</button></div></div></details>
</main><footer><span aria-hidden="true">⌁</span> 仅在本机连接 · 文章由你手动发布</footer><script src="popup.js"></script></body></html>
